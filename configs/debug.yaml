# Lightweight Debug Configuration for Fast Architecture & Unit Testing

system:
  seed: 42
  device: "cpu"
  num_workers: 0
  experiments_dir: "experiments"
  output_dir: "outputs"

data:
  dataset_name: "debug_anime_dataset"
  data_root: "data"
  fps: 8
  resolution: [64, 64]
  num_frames: 4
  batch_size: 1

models:
  vae:
    latent_channels: 2
    downsample_factor: 2
    spatial_compression: 2
    temporal_compression: 2
  transformer:
    embed_dim: 64
    num_heads: 2
    depth: 2
    patch_size: [1, 2, 2]
    context_dim: 64

conditioning:
  text_embedder:
    dim: 64
    max_length: 16
  reference_embedder:
    feature_dim: 32

memory:
  character_memory:
    max_entities: 5
    embedding_dim: 32
  world_memory:
    max_locations: 5
    embedding_dim: 32

long_video:
  chunk_frames: 4
  overlap_frames: 1
  temporal_memory_size: 2

evaluation:
  consistency_threshold: 0.5
  metrics: ["l1_loss"]

video:
  output_format: "mp4"
  codec: "libx264"
  bitrate: "1M"

training:
  epochs: 2
  learning_rate: 1.0e-3
  weight_decay: 0.0
  save_every_n_steps: 10
  checkpoint_dir: "checkpoints"
